<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="600" rx="18" fill="#1F2626"/>
  <text x="40" y="52" font-size="22" font-weight="600" fill="#E6EAE8">Wiring</text>
  <text x="40" y="76" font-size="13" fill="#93A09C">Pin numbers are GPIOs as defined at the top of ESPCounter.ino</text>

  <!-- legend -->
  <g font-size="12" fill="#93A09C">
    <line x1="640" y1="48" x2="668" y2="48" stroke="#D08A4E" stroke-width="3"/><text x="676" y="52">signal</text>
    <line x1="730" y1="48" x2="758" y2="48" stroke="#E5484D" stroke-width="3"/><text x="766" y="52">5 V</text>
    <line x1="806" y1="48" x2="834" y2="48" stroke="#7A8784" stroke-width="3"/><text x="842" y="52">GND</text>
  </g>

  <!-- signal wires -->
  <g stroke="#D08A4E" stroke-width="3" fill="none">
    <path d="M250 196 H380"/>
    <path d="M250 246 H380"/>
    <path d="M580 186 H720"/>
    <path d="M580 216 H720"/>
    <path d="M580 246 H720"/>
    <path d="M580 296 H720"/>
    <path d="M580 326 H720"/>
    <path d="M580 356 H720"/>
    <path d="M580 386 H720"/>
  </g>

  <!-- ESP32-C3 SuperMini -->
  <rect x="380" y="140" width="200" height="280" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <rect x="455" y="126" width="50" height="22" rx="4" fill="#3A4644"/>
  <text x="480" y="141" font-size="10" text-anchor="middle" fill="#93A09C">USB-C</text>
  <text x="480" y="170" font-size="15" font-weight="600" text-anchor="middle" fill="#E6EAE8">ESP32-C3</text>
  <text x="480" y="188" font-size="13" text-anchor="middle" fill="#93A09C">SuperMini</text>
  <g font-size="12" fill="#E6EAE8">
    <text x="392" y="200">GPIO 2</text>
    <text x="392" y="250">GPIO 3</text>
    <text x="568" y="190" text-anchor="end">GPIO 4</text>
    <text x="568" y="220" text-anchor="end">GPIO 5</text>
    <text x="568" y="250" text-anchor="end">GPIO 6</text>
    <text x="568" y="300" text-anchor="end">GPIO 9</text>
    <text x="568" y="330" text-anchor="end">GPIO 10</text>
    <text x="568" y="360" text-anchor="end">GPIO 20</text>
    <text x="568" y="390" text-anchor="end">GPIO 21</text>
    <text x="440" y="410" text-anchor="middle">5V</text>
    <text x="520" y="410" text-anchor="middle">GND</text>
  </g>
  <g fill="#D08A4E">
    <circle cx="380" cy="196" r="5"/><circle cx="380" cy="246" r="5"/>
    <circle cx="580" cy="186" r="5"/><circle cx="580" cy="216" r="5"/><circle cx="580" cy="246" r="5"/>
    <circle cx="580" cy="296" r="5"/><circle cx="580" cy="326" r="5"/><circle cx="580" cy="356" r="5"/><circle cx="580" cy="386" r="5"/>
  </g>

  <!-- Arcade button -->
  <rect x="60" y="150" width="190" height="130" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <circle cx="110" cy="226" r="30" fill="#E5484D" opacity="0.9"/>
  <circle cx="110" cy="226" r="21" fill="#FF6B60"/>
  <text x="155" y="176" font-size="14" font-weight="600" fill="#E6EAE8">Big button</text>
  <g font-size="12" fill="#93A09C">
    <text x="238" y="200" text-anchor="end">switch</text>
    <text x="238" y="250" text-anchor="end">LED +</text>
    <text x="72" y="272">switch and LED − to GND</text>
  </g>
  <circle cx="250" cy="196" r="5" fill="#D08A4E"/><circle cx="250" cy="246" r="5" fill="#D08A4E"/>
  <g font-size="11" fill="#93A09C">
    <text x="315" y="188" text-anchor="middle">input, pull-up</text>
    <text x="315" y="238" text-anchor="middle">status LED</text>
  </g>

  <!-- MAX7219 -->
  <rect x="720" y="150" width="200" height="118" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <text x="820" y="138" font-size="14" font-weight="600" text-anchor="middle" fill="#E6EAE8">MAX7219 8-digit display</text>
  <g font-size="12" fill="#E6EAE8"><text x="734" y="190">DIN</text><text x="734" y="220">CLK</text><text x="734" y="250">CS</text></g>
  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="22" text-anchor="end">
    <text x="906" y="224" fill="#FF4B3E" opacity="0.13">88888888</text>
    <text x="906" y="224" fill="#FF4B3E">26</text>
  </g>
  <g fill="#D08A4E"><circle cx="720" cy="186" r="5"/><circle cx="720" cy="216" r="5"/><circle cx="720" cy="246" r="5"/></g>

  <!-- SD module -->
  <rect x="720" y="280" width="200" height="130" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <text x="820" y="432" font-size="14" font-weight="600" text-anchor="middle" fill="#E6EAE8">microSD module (SPI)</text>
  <g font-size="12" fill="#E6EAE8"><text x="734" y="300">CS</text><text x="734" y="330">SCK</text><text x="734" y="360">MOSI</text><text x="734" y="390">MISO</text></g>
  <rect x="832" y="306" width="62" height="74" rx="4" fill="#3A4644"/>
  <text x="863" y="348" font-size="11" text-anchor="middle" fill="#93A09C">log.csv</text>
  <g fill="#D08A4E"><circle cx="720" cy="296" r="5"/><circle cx="720" cy="326" r="5"/><circle cx="720" cy="356" r="5"/><circle cx="720" cy="386" r="5"/></g>

  <!-- power chain -->
  <g stroke="#7A8784" stroke-width="3" fill="none"><path d="M520 420 V440"/></g>
  <g stroke="#7A8784" stroke-width="2"><line x1="505" y1="440" x2="535" y2="440"/><line x1="511" y1="446" x2="529" y2="446"/><line x1="516" y1="452" x2="524" y2="452"/></g>

  <rect x="40" y="490" width="110" height="70" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <text x="95" y="522" font-size="13" font-weight="600" text-anchor="middle" fill="#E6EAE8">USB-C</text>
  <text x="95" y="540" font-size="11" text-anchor="middle" fill="#93A09C">charging port</text>

  <rect x="190" y="490" width="170" height="70" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <text x="275" y="518" font-size="13" font-weight="600" text-anchor="middle" fill="#E6EAE8">Charge / boost</text>
  <text x="275" y="535" font-size="11" text-anchor="middle" fill="#93A09C">3.7 V in, 5 V out</text>
  <g fill="#3DDC97"><circle cx="245" cy="548" r="4"/><circle cx="265" cy="548" r="4"/><circle cx="285" cy="548" r="4"/><circle cx="305" cy="548" r="4" opacity="0.35"/></g>

  <rect x="205" y="385" width="140" height="60" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <text x="275" y="412" font-size="13" font-weight="600" text-anchor="middle" fill="#E6EAE8">LiPo 1000 mAh</text>
  <text x="275" y="430" font-size="11" text-anchor="middle" fill="#93A09C">802540, JST</text>

  <rect x="400" y="495" width="80" height="60" rx="10" fill="#273030" stroke="#4A5856" stroke-width="2"/>
  <text x="440" y="530" font-size="13" font-weight="600" text-anchor="middle" fill="#E6EAE8">Switch</text>

  <g stroke="#E5484D" stroke-width="3" fill="none">
    <path d="M150 525 H190"/>
    <path d="M275 445 V490"/>
    <path d="M360 525 H400"/>
    <path d="M440 495 V420"/>
    <path d="M440 470 H890"/>
  </g>
  <path d="M890 462 L904 470 L890 478 Z" fill="#E5484D"/>
  <circle cx="440" cy="470" r="5" fill="#E5484D"/>
  <text x="904" y="496" font-size="11" text-anchor="end" fill="#93A09C">5 V to MAX7219 and SD module</text>
</svg>
